[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mora-lang"
version = "0.4.0"
description = "Mora affective programming language runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mora project" }]

[project.scripts]
mora = "mora.runtime:main"

[tool.setuptools]
packages = ["mora"]
