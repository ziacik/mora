name: CI

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile runtime
        run: python3 -m py_compile mora/*.py
      - name: Reject application leakage
        run: |
          if grep -RniE 'ScanSlicer|Scan Slicer|PhysicalPhoto|DetectRegions|OpenImage|AcquireImage|AddRegion|DeleteRegion|ExportRegions|physical photographic prints|photo print|MoraPong|Pong|paddle|ball|score|LeftUpPressed|ServeLeft' mora; then
            echo "Application-specific code leaked into the Mora runtime"
            exit 1
          fi
      - name: Install Mora
        run: python3 -m pip install --no-deps --no-build-isolation .
      - name: Check reference Mora application
        run: |
          git clone --depth 1 https://github.com/ziacik/scan-slicer-emo.git reference-app
          mora check reference-app/app.mora
          mora simulate reference-app/app.mora 'correction(A)' 'correction(A)' 'correction(A)'
          git clone --depth 1 https://github.com/ziacik/mora-pong.git second-app
          mora check second-app/app.mora
      - name: Generic runtime smoke tests
        run: |
          python3 - <<'PY'
          from mora.gtk_backend import BUTTON_RE
          from mora.faculties import quad_valid, point_in_quad
          assert BUTTON_RE.match('button Remove invites RemoveThing when focus exists')
          q=[[10.,10.],[110.,10.],[110.,90.],[10.,90.]]
          assert quad_valid(q)
          assert point_in_quad([50,50], q)
          print('generic runtime smoke tests: OK')
          PY

  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo gir1.2-gtk-4.0 gir1.2-adw-1 python3-pil python3-requests python3-opencv xvfb dbus-x11
      - name: Compile and import GTK backend
        run: /usr/bin/python3 -m py_compile mora/*.py
      - name: Start reference Mora scene
        run: |
          git clone --depth 1 https://github.com/ziacik/scan-slicer-emo.git reference-app
          set +e
          timeout 5s dbus-run-session -- xvfb-run -a /usr/bin/python3 mora.py run reference-app/app.mora > /tmp/mora-gtk-1.log 2>&1
          code=$?
          cat /tmp/mora-gtk-1.log
          if grep -E 'Traceback|TypeError|Mora error' /tmp/mora-gtk-1.log; then exit 1; fi
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Mora GTK application exited unexpectedly with code $code"
            exit "$code"
          fi
          echo "Mora GTK scene stayed alive: OK"
          git clone --depth 1 https://github.com/ziacik/mora-pong.git second-app
          set +e
          timeout 5s dbus-run-session -- xvfb-run -a /usr/bin/python3 mora.py run second-app/app.mora > /tmp/mora-gtk-2.log 2>&1
          code=$?
          cat /tmp/mora-gtk-2.log
          if grep -E 'Traceback|TypeError|Mora error' /tmp/mora-gtk-2.log; then exit 1; fi
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Second Mora GTK application exited unexpectedly with code $code"
            exit "$code"
          fi
          echo "Second Mora GTK scene stayed alive: OK"
